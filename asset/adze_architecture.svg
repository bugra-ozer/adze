<svg viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- transparent background (no background rect) -->

  <!-- ============ main ============ -->
  <path d="M 85 95 L 85 25 L 100 25" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="108" y="32" font-size="20" fill="rgb(194,192,182)">main</text>

  <!-- ============ incoming providers (left column) ============ -->
  <text x="80" y="122" font-size="21" fill="rgb(250,249,245)">github</text>
  <text x="80" y="192" font-size="21" fill="rgb(250,249,245)">twilio</text>
  <text x="80" y="262" font-size="21" fill="rgb(250,249,245)">stripe</text>

  <!-- network icon indicating incoming HTTP traffic -->
  <g transform="translate(20,168)">
    <circle cx="14" cy="14" r="14" fill="rgba(147,197,253,0.06)" stroke="#93c5fd" stroke-width="1.3"/>
    <ellipse cx="14" cy="14" rx="14" ry="6" fill="none" stroke="#93c5fd" stroke-width="1"/>
    <ellipse cx="14" cy="14" rx="6" ry="14" fill="none" stroke="#93c5fd" stroke-width="1"/>
    <line x1="0" y1="14" x2="28" y2="14" stroke="#93c5fd" stroke-width="1"/>
  </g>
  <text x="34" y="216" font-size="11" fill="#93c5fd" text-anchor="middle">HTTP</text>

  <!-- merge bus: github/twilio/stripe -> app -->
  <line x1="185" y1="115" x2="345" y2="115" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="185" y1="185" x2="345" y2="185" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="345" y1="185" x2="345" y2="115" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="185" y1="255" x2="345" y2="255" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="345" y1="255" x2="345" y2="115" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <circle cx="345" cy="115" r="2.5" fill="rgba(222,220,209,0.5)"/>

  <!-- POST badge on the merged incoming line -->
  <rect x="313" y="62" width="60" height="24" rx="5" fill="rgba(147,197,253,0.06)" stroke="#93c5fd" stroke-width="1"/>
  <text x="343" y="78.5" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">POST</text>
  <line x1="343" y1="86" x2="345" y2="112" stroke="#93c5fd" stroke-width="1"/>

  <line x1="349" y1="115" x2="408" y2="115" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ top pipeline: app -> handler -> storage ============ -->
  <text x="415" y="122" font-size="21" fill="rgb(250,249,245)">app</text>
  <line x1="453" y1="115" x2="613" y2="115" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="620" y="122" font-size="21" fill="rgb(250,249,245)">handler</text>
  <line x1="700" y1="115" x2="843" y2="115" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="850" y="122" font-size="21" fill="rgb(250,249,245)">storer</text>

  <!-- ============ app's sub-handlers ============ -->
  <line x1="415" y1="130" x2="415" y2="390" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="415" y1="250" x2="450" y2="250" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="460" y="256" font-size="19" fill="rgb(250,249,245)">github</text>
  <line x1="415" y1="320" x2="450" y2="320" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="460" y="326" font-size="19" fill="rgb(250,249,245)">twilio</text>
  <line x1="415" y1="390" x2="450" y2="390" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="460" y="396" font-size="19" fill="rgb(250,249,245)">stripe</text>

  <!-- ============ sub-handlers -> verify (corrected relationship, kept close to providers) ============ -->
  <line x1="545" y1="250" x2="565" y2="250" stroke="#5eead4" stroke-width="1.5"/>
  <line x1="565" y1="250" x2="565" y2="320" stroke="#5eead4" stroke-width="1.5"/>
  <line x1="545" y1="320" x2="565" y2="320" stroke="#5eead4" stroke-width="1.5"/>
  <line x1="545" y1="390" x2="565" y2="390" stroke="#5eead4" stroke-width="1.5"/>
  <line x1="565" y1="390" x2="565" y2="320" stroke="#5eead4" stroke-width="1.5"/>
  <circle cx="565" cy="320" r="2.5" fill="#5eead4"/>
  <line x1="569" y1="320" x2="608" y2="320" stroke="#5eead4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="326" font-size="19" fill="#5eead4" font-weight="bold">verifier</text>

  <!-- ============ storage -> db tables (routed below the "storage" label so lines don't cross the text) ============ -->
  <line x1="887" y1="127" x2="887" y2="138" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="855" y1="138" x2="925" y2="138" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>

  <line x1="855" y1="138" x2="855" y2="490" stroke="rgba(222,220,209,0.55)" stroke-width="1"/>
  <line x1="855" y1="490" x2="260" y2="490" stroke="rgba(222,220,209,0.55)" stroke-width="1"/>
  <line x1="260" y1="490" x2="260" y2="646" stroke="rgba(222,220,209,0.55)" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="890" y1="138" x2="890" y2="540" stroke="rgba(222,220,209,0.55)" stroke-width="1"/>
  <line x1="890" y1="540" x2="705" y2="540" stroke="rgba(222,220,209,0.55)" stroke-width="1"/>
  <line x1="705" y1="540" x2="705" y2="646" stroke="rgba(222,220,209,0.55)" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="925" y1="138" x2="925" y2="575" stroke="rgba(222,220,209,0.55)" stroke-width="1"/>
  <line x1="925" y1="575" x2="1150" y2="575" stroke="rgba(222,220,209,0.55)" stroke-width="1"/>
  <line x1="1150" y1="575" x2="1150" y2="646" stroke="rgba(222,220,209,0.55)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ db/ group ============ -->
  <rect x="20" y="600" width="1370" height="210" rx="8" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Database Icon -->
  <g transform="translate(35, 610)" stroke="rgb(250,249,245)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
    <path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"></path>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path>
  </g>

  <!-- providers table -->
  <rect x="50" y="650" width="420" height="130" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(222,220,209,0.5)" stroke-width="1"/>
  <text x="70" y="680" font-size="19" font-weight="500" fill="rgb(250,249,245)">PROVIDERS</text>
  <line x1="70" y1="700" x2="430" y2="700" stroke="rgba(222,220,209,0.35)" stroke-width="1"/>
  <line x1="70" y1="725" x2="340" y2="725" stroke="rgba(222,220,209,0.25)" stroke-width="1"/>

  <!-- webhooks table -->
  <rect x="495" y="650" width="420" height="130" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(222,220,209,0.5)" stroke-width="1"/>
  <text x="515" y="680" font-size="19" font-weight="500" fill="rgb(250,249,245)">WEBHOOKS</text>
  <line x1="515" y1="700" x2="875" y2="700" stroke="rgba(222,220,209,0.35)" stroke-width="1"/>
  <line x1="515" y1="725" x2="785" y2="725" stroke="rgba(222,220,209,0.25)" stroke-width="1"/>

  <!-- forwarding_attempts table -->
  <rect x="940" y="650" width="420" height="130" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(222,220,209,0.5)" stroke-width="1"/>
  <text x="960" y="680" font-size="19" font-weight="500" fill="rgb(250,249,245)">FORWARDS</text>
  <line x1="960" y1="700" x2="1320" y2="700" stroke="rgba(222,220,209,0.35)" stroke-width="1"/>
  <line x1="960" y1="725" x2="1230" y2="725" stroke="rgba(222,220,209,0.25)" stroke-width="1"/>

  <text x="20" y="840" font-size="17" fill="rgb(194,192,182)">db/ — storage tables.</text>
</svg>